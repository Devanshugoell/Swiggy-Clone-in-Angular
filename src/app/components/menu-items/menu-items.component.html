    <div class="space-y-3">
      @for (item of items; track item.card.info.id) {
        <div class="grid grid-cols-12 gap-3 border-b border-slate-200 py-4">
          <div class="col-span-8 flex flex-col gap-2 sm:col-span-9">
            <span class="text-xs font-semibold uppercase tracking-[0.2em]" [ngClass]="item.card.info.isVeg === 1 ? 'text-emerald-600' : 'text-rose-600'">
              {{ item.card.info.isVeg === 1 ? 'Veg' : 'Non Veg' }}
            </span>
            <h4 class="text-base font-bold text-slate-900">{{ item.card.info.name }}</h4>
            <p class="text-sm font-semibold text-slate-700">₹ {{ price(item) }}</p>
            <p class="text-sm leading-6 text-slate-500">{{ item.card.info.description || 'Freshly prepared and delivered hot.' }}</p>
          </div>

          <div class="col-span-4 flex flex-col items-center justify-center sm:col-span-3">
            <img
              class="h-20 w-20 rounded-2xl object-cover shadow-sm sm:h-24 sm:w-24"
              [src]="imageUrl(item)"
              [alt]="item.card.info.name"

            />
            <button
              type="button"
              class="relative -top-3 rounded-xl bg-white px-5 py-2 text-sm font-extrabold text-emerald-600 shadow-lg ring-1 ring-black/5 transition hover:-translate-y-0.5"
              (click)="add(item)"
            >
              ADD +
            </button>
          </div>
        </div>
      }
    </div>
