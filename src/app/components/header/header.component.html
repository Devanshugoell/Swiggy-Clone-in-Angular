    <header class="sticky top-0 z-40 border-b border-black/5 bg-white/95 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-8 lg:px-12">
        <a routerLink="/restaurant" class="flex items-center gap-3">
          <img src="/images/logo.svg" alt="Swiggy" class="h-10 w-10 rounded-xl bg-orange-50 p-1" />
          <div>
            <div class="text-lg font-black tracking-[0.25em] text-orange-500">SWIGGY</div>
            <div class="text-xs text-slate-400">Order from favorite restaurants</div>
          </div>
        </a>

        <nav class="hidden items-center gap-3 md:flex">
          <a routerLink="/search" class="header-link">Search</a>
          <a routerLink="/cart" class="header-link">Cart ({{ cartService.count() }})</a>
          <button type="button" class="header-link" (click)="logout()">Logout</button>
        </nav>

        <button
          type="button"
          class="rounded-2xl border border-slate-200 px-3 py-2 text-sm font-semibold md:hidden"
          [attr.aria-label]="mobileMenuOpen() ? 'Close menu' : 'Open menu'"
          (click)="toggleMobileMenu()"
        >
          @if (mobileMenuOpen()) {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          } @else {
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          }
        </button>
      </div>

      @if (mobileMenuOpen()) {
        <div class="border-t border-slate-200 bg-white px-4 py-3 md:hidden">
          <div class="flex flex-col gap-2">
            <a routerLink="/search" class="mobile-link" (click)="mobileMenuOpen.set(false)">Search</a>
            <a routerLink="/cart" class="mobile-link" (click)="mobileMenuOpen.set(false)">Cart ({{ cartService.count() }})</a>
            <button type="button" class="mobile-link text-left" (click)="logout()">Logout</button>
          </div>
        </div>
      }
    </header>
