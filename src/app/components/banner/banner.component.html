    <section class="px-4 sm:px-8 md:px-16 lg:px-20">
      <div class="mb-4 mt-4 flex items-center justify-between">
        <h2 class="text-xl font-extrabold text-slate-900 sm:text-2xl">
          {{ banners.length ? "What's on your mind?" : 'Find your favorite dish' }}
        </h2>
      </div>

      <div class="mb-8 grid grid-cols-2 gap-3 border-b border-slate-200 pb-6 sm:grid-cols-4 lg:grid-cols-8">
        @if (banners.length) {
          @for (banner of banners.slice(0, 8); track banner.id) {
            <div class="flex items-center justify-center rounded-3xl bg-white p-3 shadow-sm ring-1 ring-black/5">
              <img
                class="h-28 w-28 sm:h-32 sm:w-32"
                [src]="imageBaseUrl + banner.imageId"
                [alt]="banner.action?.text || 'Food banner'"
              />
            </div>
          }
        } @else {
          @for (placeholder of placeholders; track placeholder) {
            <div class="h-28 animate-pulse rounded-3xl bg-slate-200"></div>
          }
        }
      </div>
    </section>
