    <section class="px-4 pb-10 sm:px-8 md:px-16 lg:px-20">
      <h2 class="mb-5 text-xl font-extrabold text-slate-900 sm:text-2xl">{{ title }}</h2>

      @if (restaurants.length) {
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
          @for (restaurant of restaurants; track restaurant.info.id) {
            <a [routerLink]="['/restaurants', restaurant.info.id]">
              <app-restaurant-card
                [restaurant]="restaurant.info"
                [showNewBadge]="!!restaurant.info.isNewlyOnboarded"
              ></app-restaurant-card>
            </a>
          }
        </div>
      } @else {
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
          @for (placeholder of placeholders; track placeholder) {
            <div class="h-72 animate-pulse rounded-3xl bg-slate-200"></div>
          }
        </div>
      }
    </section>
