    <section class="mx-auto max-w-7xl px-4 py-8 sm:px-8 lg:px-12">
      <div class="rounded-[2rem] bg-white p-6 shadow-sm ring-1 ring-black/5 sm:p-8">
        <div class="flex flex-col gap-6">
          <div>
            <p class="text-sm font-bold uppercase tracking-[0.3em] text-orange-500">Search</p>
            <h1 class="mt-2 text-3xl font-black text-slate-900">Explore restaurants and cuisines</h1>
          </div>

          <input
            type="text"
            class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-5 py-4 outline-none transition focus:border-orange-400 focus:bg-white"
            placeholder="Search for restaurants and food"
            [value]="query()"
            (input)="query.set(($any($event.target)).value)"
          />
        </div>
      </div>

      <section class="mt-8">

        <div class="grid grid-cols-3 gap-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8">
          @for (cuisine of cuisines().slice(0, 12); track cuisine.id) {
            <div class="rounded-3xl bg-white p-3 shadow-sm ring-1 ring-black/5">
              <img [src]="imageBaseUrl + cuisine.imageId" alt="Cuisine" class="h-24 w-full rounded-2xl object-cover" />
            </div>
          }
        </div>
      </section>

      <section class="mt-10">
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-xl font-extrabold text-slate-900">Restaurant results</h2>
          <p class="text-sm text-slate-500">{{ filteredRestaurants().length }} results</p>
        </div>

        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
          @for (restaurant of filteredRestaurants(); track restaurant.info.id) {
            <a [routerLink]="['/restaurants', restaurant.info.id]">
              <app-restaurant-card [restaurant]="restaurant.info"></app-restaurant-card>
            </a>
          }
        </div>
      </section>
    </section>
